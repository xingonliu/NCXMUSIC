name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm t05:spike
      - run: node scripts/run-window-chrome-spike.mjs
      - run: pnpm t07:spike
      - run: pnpm t02:verify-boundaries
      - run: pnpm t02:spike -- --scenario guest --target build --profile ci-guest
      - run: pnpm t02:spike -- --scenario invalid --target build --profile ci-invalid
      - run: pnpm smoke:dev
      - run: pnpm smoke:build
      - run: pnpm smoke:packaged
